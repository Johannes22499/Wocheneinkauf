name: Angebote aktualisieren

on:
  schedule:
    # 06:00 Europe/Berlin (Sommerzeit UTC+2) = 04:00 UTC, im Winter 05:00 Ortszeit.
    # Sonntag: neue Woche (Aldi u. a.). Donnerstag: neue Kaufland-Woche (Do–Mi).
    - cron: "0 4 * * 0,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: angebote-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scraper ausführen
        run: python3 -m scraper.main

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angebote/
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Angeboten - nichts zu committen."
            exit 0
          fi
          git commit -m "Angebote aktualisiert ($(date -u +%Y-%m-%d))"
          git push
